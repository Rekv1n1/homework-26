<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Motors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="page">
    <header class="header">
      <div class="logo"><span class="logo-mark">A</span><span class="logo-text">APEX <b>MOTORS</b></span></div>
      <nav class="tabs">
        <button class="tab active" data-brand="mercedes">Mercedes</button>
        <button class="tab" data-brand="bmw">BMW</button>
        <button class="tab" data-brand="porsche">Porsche</button>
      </nav>
    </header>

    <section class="intro">
      <div>
        <p class="eyebrow">Коллекция 2026</p>
        <h1 id="brand-title">Mercedes-Benz</h1>
      </div>
      <p class="count" id="brand-count"></p>
    </section>

    <main class="cards"></main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="close" id="modal-close" aria-label="Закрыть">×</button>
      <div class="photo modal-photo" id="modal-photo"></div>
      <div class="modal-info">
        <p class="eyebrow" id="modal-brand"></p>
        <h2 id="modal-title"></h2>
        <p class="modal-price" id="modal-price"></p>
        <p class="modal-desc" id="modal-desc"></p>
        <p class="stock"><i class="dot"></i>В наличии: <b id="modal-count"></b></p>
        <p class="color-label">Цвет</p>
        <div class="colors" id="modal-colors"></div>
        <button class="btn btn-big" id="modal-order">Заказать</button>
      </div>
    </div>
  </div>

  <!-- Axios подключается ДО script.js -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
